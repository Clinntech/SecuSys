<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecuSys | Network Integration</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .config-card { background: #161b22; border: 1px solid #30363d; padding: 40px; border-radius: 12px; width: 400px; }
        h1 { color: #58a6ff; font-size: 1.4rem; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        label { font-size: 0.8em; color: #8b949e; display: block; margin-bottom: 5px; }
        input { width: 93%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        .back-link { display: block; text-align: center; margin-top: 20px; color: #8b949e; text-decoration: none; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="config-card">
        <h1>Router Integration</h1>
        <form method="POST">
            <label>Cisco Device IP (Target for remediation)</label>
            <input type="text" name="device_ip" value="{{ config.device_ip if config else '' }}" placeholder="192.168.1.1" required>
            
            <label>SSH Management Username</label>
            <input type="text" name="ssh_user" value="{{ config.ssh_user if config else '' }}" placeholder="admin" required>
            
            <label>SSH Password (Encryption Enabled)</label>
            <input type="password" name="ssh_password" placeholder="••••••••" required>
            
            <button type="submit">Establish Secure Bridge</button>
        </form>
        <a href="/" class="back-link">Return to Command Center</a>
    </div>
</body>
</html>

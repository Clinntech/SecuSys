<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecuSys | Platform Enrollment</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 40px; border-radius: 10px; width: 350px; }
        h1 { color: #58a6ff; font-size: 1.5rem; text-align: center; margin-bottom: 20px;}
        input { width: 93%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        p { text-align: center; font-size: 0.8em; color: #8b949e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign-Up</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Company Username" required>
            <input type="password" name="password" placeholder="Access Password" required>
            <button type="submit">Enroll User</button>
        </form>
        <p>Your password will be encrypted using professional SHA-256 Hashing protocols.</p>
    </div>
</body>
</html>
